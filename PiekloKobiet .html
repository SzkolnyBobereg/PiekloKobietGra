const ABANK={}; // cache: ścieżka -> 'OK' | 'FAILED' | undefined (jeszcze nie sprawdzone)

// playSfx: próbuje odtworzyć prawdziwy plik z ASSETS (jeśli wcześniej wykryty jako dostępny); zwraca true jeśli spróbował.

 if(ABANK[path]!=='OK')return false;
 try{const el=new Audio(ASSETS.base+path);el.volume=cl(gain,0,1)*cfg.sfx*cfg.master;el.play().catch(()=>{});return true}catch(e){return false}}
// playMusic: HTMLAudioElement, pętla. Jeśli plik nie istnieje, po prostu nic nie gra —
// proceduralny dron napięcia (drG/dr1) i tak działa niezależnie, więc cisza muzyczna nie oznacza ciszy w grze.
let musicEl=null,musicKey=null;
function playMusic(key,path){if(musicKey===key)return;musicKey=key;if(musicEl){try{musicEl.pause()}catch(e){}musicEl=null}
 const p=path||ASSETS.music[key];if(!p)return;try{const a=new Audio(ASSETS.base+p);a.loop=true;a.volume=cl(cfg.music*cfg.master,0,1);a.play().catch(()=>{});a.onerror=()=>{if(musicEl===a)musicEl=null};musicEl=a}catch(e){}}
function ainit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination);
drG=AC.createGain();drG.gain.value=0;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;dr1=AC.createOscillator();dr1.type='sawtooth';dr1.frequency.value=46;dr1.connect(lp);lp.connect(drG);drG.connect(MG);dr1.start();

 if(playSfx(real,n.g||.4,n.pan||0))return;SND[n.k]&&SND[n.k](n.g||.4,n.pan||0,n.sf)});
/* ===== POZIOM PROCEDURALNY ===== */
const NAMES_G=['Salon','Kuchnia','Biblioteka','Sypialnia więźniarek','Pracownia Zofii','Jadalnia','Palarnia','Pokój gościnny','Spiżarnia','Ogród zimowy','Pokój muzyczny','Garderoba'];

function palColor(surf,floor,rr){const base={wood:[.42,.28,.16],carpet:[.32,.14,.18],stone:[.26,.26,.28],grass:[.14,.26,.14]}[surf];const v=.7+rr()*.5;return '#'+base.map(c=>Math.round(cl(c*v*255,10,90)).toString(16).padStart(2,'0')).join('')}
function genFloor(seed,floor){
 const rr=RNG(seed),ri1=(a,b)=>Math.floor(a+rr()*(b-a+1)),rb=(p=.5)=>rr()<p;
 const MN=6,grid=Array.from({length:H},()=>Array(W).fill('#')),rooms=[];
 function carve(x1,y1,x2,y2){if(rb()){for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)grid[y1][x]='.';for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)grid[y][x2]='.'}
 else{for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)grid[y][x1]='.';for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)grid[y2][x]='.'}}
 function split(x,y,w,h,depth){let leaf=depth<=0||(w<MN*2+3&&h<MN*2+3);
  if(leaf){const rw=Math.max(MN,Math.min(w-2,ri1(Math.floor(w*.5),w-2))),rh=Math.max(MN,Math.min(h-2,ri1(Math.floor(h*.5),h-2)));
   const rx=x+ri1(1,Math.max(1,w-rw-1)),ry=y+ri1(1,Math.max(1,h-rh-1)),room={x:rx,y:ry,w:rw,h:rh};rooms.push(room);
   return{cx:rx+(rw>>1),cy:ry+(rh>>1)}}

  if(horiz){const sy=y+ri1(MN,Math.max(MN,h-MN));const a=split(x,y,w,sy-y,depth-1),b=split(x,sy,w,y+h-sy,depth-1);carve(a.cx,a.cy,b.cx,b.cy);return rb()?a:b}
  else{const sx=x+ri1(MN,Math.max(MN,w-MN));const a=split(x,y,sx-x,h,depth-1),b=split(sx,y,x+w-sx,h,depth-1);carve(a.cx,a.cy,b.cx,b.cy);return rb()?a:b}}
 split(1,1,W-2,H-2,4);
 rooms.sort((a,b)=>b.w*b.h-a.w*a.h);
 rooms.forEach(r=>{for(let y=r.y;y<r.y+r.h&&y<H-1;y++)for(let x=r.x;x<r.x+r.w&&x<W-1;x++)grid[y][x]='.'});
 const ri=Array.from({length:H},()=>Array(W).fill(-1));
 rooms.forEach((r,i)=>{for(let y=r.y;y<r.y+r.h&&y<H;y++)for(let x=r.x;x<r.x+r.w&&x<W;x++)if(grid[y]&&grid[y][x]==='.')ri[y][x]=i});
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){if(ri[y][x]<0||grid[y][x]!=='.')continue;

   let near=false;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)if(grid[y+yy]&&grid[y+yy][x+xx]==='D')near=true;

 const q=[st0[0]];while(q.length){const[x,y]=q.pop();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)return;if(seen[ny*W+nx])return;if(grid[ny][nx]==='#')return;seen[ny*W+nx]=1;q.push([nx,ny])})}
 rooms.forEach(r=>{const cx0=r.x+(r.w>>1),cy0=r.y+(r.h>>1);if(!seen[cy0*W+cx0]){let bx=st0[0][0],by=st0[0][1];const x0=Math.min(cx0,bx),x1e=Math.max(cx0,bx);for(let x=x0;x<=x1e;x++)grid[cy0][x]='.';const y0=Math.min(cy0,by),y1e=Math.max(cy0,by);for(let y=y0;y<=y1e;y++)grid[y][bx]='.';}});

 rooms.forEach((r,i)=>{r.i=i;r.area=r.w*r.h;r.type='generic'});
